name: Release git-knot

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
      - name: Verify tag and manifest versions
        run: pnpm run check:version -- --tag "$GITHUB_REF_NAME"
      - run: pnpm run check:update-policy
      - run: pnpm run check:bindings
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux bundle dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
      - name: Build and upload signed updater artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: git-knot v__VERSION__
          releaseBody: |
            git-knot v__VERSION__

            安装包和应用内更新元数据由 GitHub Actions 自动生成并签名。
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Create and upload Windows portable ZIP
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $binary = "src-tauri/target/release/git-knot.exe"
          if (-not (Test-Path $binary)) {
            throw "Windows release binary not found: $binary"
          }
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $portableDirectory = Join-Path $env:RUNNER_TEMP "git-knot-portable"
          $portablePath = Join-Path $env:RUNNER_TEMP "git-knot_${version}_x64-portable.zip"
          New-Item -ItemType Directory -Path $portableDirectory -Force | Out-Null
          Copy-Item $binary (Join-Path $portableDirectory "git-knot.exe")
          Compress-Archive `
            -Path (Join-Path $portableDirectory "git-knot.exe") `
            -DestinationPath $portablePath
          gh release upload $env:GITHUB_REF_NAME $portablePath `
            --repo $env:GITHUB_REPOSITORY `
            --clobber

  verify-and-publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install minisign verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Validate signed updater metadata
        id: validate-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="v${VERSION}"
          mkdir -p "$RUNNER_TEMP/git-knot-release"
          gh api "repos/tisrop/git-knot/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          RELEASE_ID="$(jq --arg tag "$TAG" -r \
            '[.[] | select(.tag_name == $tag)] | if length == 1 then .[0].id else empty end' \
            "$RUNNER_TEMP/releases.json")"
          if [[ -z "$RELEASE_ID" ]]; then
            echo "未找到唯一的 ${TAG} Release" >&2
            exit 1
          fi
          gh api "repos/tisrop/git-knot/releases/${RELEASE_ID}" > "$RUNNER_TEMP/release.json"
          while IFS=$'\t' read -r asset_id asset_name; do
            if [[ -z "$asset_name" || "$asset_name" == */* || "$asset_name" == "." || "$asset_name" == ".." ]]; then
              echo "Release 包含非法资产名" >&2
              exit 1
            fi
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/tisrop/git-knot/releases/assets/${asset_id}" \
              > "$RUNNER_TEMP/git-knot-release/${asset_name}"
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' "$RUNNER_TEMP/release.json")
          jq '.assets' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/assets.json"
          pnpm run validate:github-release \
            --metadata "$RUNNER_TEMP/git-knot-release/latest.json" \
            --assets "$RUNNER_TEMP/assets.json" \
            --artifacts "$RUNNER_TEMP/git-knot-release" \
            --tauri-config src-tauri/tauri.conf.json \
            --repository tisrop/git-knot \
            --tag "$TAG" \
            --version "$VERSION"
          PORTABLE_NAME="git-knot_${VERSION}_x64-portable.zip"
          if [[ "$(jq --arg name "$PORTABLE_NAME" '[.assets[] | select(.name == $name)] | length' "$RUNNER_TEMP/release.json")" != "1" ]]; then
            echo "Windows 便携版 ZIP 无法唯一匹配：${PORTABLE_NAME}" >&2
            exit 1
          fi
          PORTABLE_PATH="$RUNNER_TEMP/git-knot-release/$PORTABLE_NAME"
          mapfile -t PORTABLE_ENTRIES < <(unzip -Z1 "$PORTABLE_PATH")
          if [[ "${#PORTABLE_ENTRIES[@]}" != "1" || "${PORTABLE_ENTRIES[0]}" != "git-knot.exe" ]]; then
            echo "Windows 便携版 ZIP 必须只包含根目录下的 git-knot.exe" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/git-knot-portable"
          unzip -q "$PORTABLE_PATH" -d "$RUNNER_TEMP/git-knot-portable"
          PORTABLE_MAGIC="$(od -An -tx1 -N2 "$RUNNER_TEMP/git-knot-portable/git-knot.exe" | tr -d ' \n')"
          if [[ "$PORTABLE_MAGIC" != "4d5a" ]]; then
            echo "Windows 便携版不是有效的 PE 可执行文件" >&2
            exit 1
          fi
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
      - name: Remove standalone updater signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r asset_id; do
            [[ -z "$asset_id" ]] && continue
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done < <(jq -r '.assets[] | select(.name | endswith(".sig")) | .id' "$RUNNER_TEMP/release.json")
      - name: Generate download guide and publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.validate-release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            > "$RUNNER_TEMP/clean-release.json"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            | jq -s 'add' > "$RUNNER_TEMP/clean-assets.json"
          GENERATED_BODY="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f configuration_file_path=.github/release.yml \
            --jq '.body')"
          jq --arg body "$GENERATED_BODY" '.body = $body' \
            "$RUNNER_TEMP/clean-release.json" > "$RUNNER_TEMP/release-with-notes.json"
          node scripts/release/release-download-guide.mjs \
            --release "$RUNNER_TEMP/release-with-notes.json" \
            --assets "$RUNNER_TEMP/clean-assets.json" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --output "$RUNNER_TEMP/release-body.md"
          RELEASE_BODY="$(cat "$RUNNER_TEMP/release-body.md")"
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f body="$RELEASE_BODY" \
            -F draft=false
