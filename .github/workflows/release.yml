name: Release git-knot

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
      - name: Verify tag and manifest versions
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          TAURI_VERSION="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          test "$VERSION" = "$CARGO_VERSION"
          test "$VERSION" = "$TAURI_VERSION"
          if [[ "${GITHUB_REF_TYPE}" = "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${VERSION}"
          fi
      - run: pnpm run check:update-policy
      - run: pnpm run check:bindings
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux bundle dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
      - name: Build and upload signed updater artifacts
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: git-knot v__VERSION__
          releaseBody: |
            git-knot v__VERSION__

            安装包和应用内更新元数据由 GitHub Actions 自动生成并签名。
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  verify-and-publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install minisign verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Validate signed updater metadata
        id: validate-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="v${VERSION}"
          mkdir -p "$RUNNER_TEMP/git-knot-release"
          gh api "repos/tisrop/git-knot/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          RELEASE_ID="$(jq --arg tag "$TAG" -r \
            '[.[] | select(.tag_name == $tag)] | if length == 1 then .[0].id else empty end' \
            "$RUNNER_TEMP/releases.json")"
          if [[ -z "$RELEASE_ID" ]]; then
            echo "未找到唯一的 ${TAG} Release" >&2
            exit 1
          fi
          gh api "repos/tisrop/git-knot/releases/${RELEASE_ID}" > "$RUNNER_TEMP/release.json"
          while IFS=$'\t' read -r asset_id asset_name; do
            if [[ -z "$asset_name" || "$asset_name" == */* || "$asset_name" == "." || "$asset_name" == ".." ]]; then
              echo "Release 包含非法资产名" >&2
              exit 1
            fi
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/tisrop/git-knot/releases/assets/${asset_id}" \
              > "$RUNNER_TEMP/git-knot-release/${asset_name}"
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' "$RUNNER_TEMP/release.json")
          jq '.assets' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/assets.json"
          pnpm run validate:github-release \
            --metadata "$RUNNER_TEMP/git-knot-release/latest.json" \
            --assets "$RUNNER_TEMP/assets.json" \
            --artifacts "$RUNNER_TEMP/git-knot-release" \
            --tauri-config src-tauri/tauri.conf.json \
            --repository tisrop/git-knot \
            --tag "$TAG" \
            --version "$VERSION"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method PATCH
          "repos/tisrop/git-knot/releases/${{ steps.validate-release.outputs.release_id }}"
          -F draft=false
